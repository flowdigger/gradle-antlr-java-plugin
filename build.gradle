import org.flowdigger.gradle.antlr.XmlAstGradleTask
import java.security.MessageDigest

plugins {
    id 'java'
    id 'antlr'
    id 'java-gradle-plugin'
    id 'jacoco'
    id 'org.flowdigger.gradle.antlr' version '1.0.0'
    id 'maven-publish'
    id 'signing'
    id 'checkstyle'
    id 'org.owasp.dependencycheck' version '13.0.0'
    id 'com.github.spotbugs' version '6.1.0'
}

group = 'org.flowdigger.gradle'
version = '1.0.0'

checkstyle {
    toolVersion = '10.26.1'
    configFile = file('checkstyle.xml')
}

ext {
    spotbugsEngineVersion = '4.8.6'
    findSecBugsVersion = '1.13.0'
}

gradlePlugin {
    website = 'https://github.com/flowdigger/gradle-antlr-java-plugin'
    vcsUrl = 'https://github.com/flowdigger/gradle-antlr-java-plugin'
    plugins {
        xmlAstJava {
            id = 'org.flowdigger.gradle.antlr.java'
            implementationClass = 'org.flowdigger.gradle.antlr.XmlAstJavaPlugin'
            displayName = 'Gradle ANTLR Java Plugin'
            description = 'Preconfigured XML AST task support for Java grammar parsing.'
            tags.set(['antlr', 'xml', 'ast', 'java'])
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    implementation("org.flowdigger.gradle:gradle-antlr-plugin:1.0.0")
    implementation 'org.antlr:antlr4-runtime:4.13.2'

    antlr 'org.antlr:antlr4:4.13.2'

    testImplementation gradleTestKit()
    testImplementation 'junit:junit:4.13.2'

    spotbugsPlugins "com.h3xstream.findsecbugs:findsecbugs-plugin:${findSecBugsVersion}"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = 'Gradle ANTLR Java Plugin'
                description = 'Gradle plugin for XML AST conversion of Java sources'
                url = 'https://github.com/flowdigger/gradle-antlr-java-plugin'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }

                developers {
                    developer {
                        id = 'flowdigger'
                        name = 'Flowdigger'
                    }
                }

                scm {
                    connection = 'scm:git:https://github.com/flowdigger/gradle-antlr-java-plugin.git'
                    developerConnection = 'scm:git:ssh://git@github.com/flowdigger/gradle-antlr-java-plugin.git'
                    url = 'https://github.com/flowdigger/gradle-antlr-java-plugin'
                }
            }
        }
    }

    repositories {
        mavenLocal()
    }
}

signing {
    def signingKey = providers.gradleProperty('signingKey').orNull
    def signingPassword = providers.gradleProperty('signingPassword').orNull
    def signingKeyId = providers.gradleProperty('signingKeyId').orNull
    if (signingKey && signingPassword) {
        if (signingKeyId) {
            useInMemoryPgpKeys(signingKeyId, signingKey, signingPassword)
        } else {
            useInMemoryPgpKeys(signingKey, signingPassword)
        }
    } else {
        useGpgCmd()
    }
    sign publishing.publications.mavenJava
}

dependencyCheck {
    formats = ['HTML', 'JSON', 'XML']
    failBuildOnCVSS = 7.0f
    def dependencyCheckSuppression = file('dependency-check-suppressions.xml')
    if (dependencyCheckSuppression.exists()) {
        suppressionFile = dependencyCheckSuppression.absolutePath
    }
    analyzers {
        ossIndex {
            enabled = false
        }
    }
    nvd {
        def resolvedApiKey = providers.gradleProperty('org.owasp.dependencycheck.nvd.api.key').orNull
                ?: System.getenv('NVD_API_KEY')
        if (resolvedApiKey?.trim()) {
            apiKey = resolvedApiKey.trim()
        }
    }
}

spotbugs {
    toolVersion = spotbugsEngineVersion
    ignoreFailures = false
    effort = com.github.spotbugs.snom.Effort.valueOf('DEFAULT')
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf('MEDIUM')
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        html.required = true
        xml.required = false
    }
}

tasks.named('spotbugsMain', com.github.spotbugs.snom.SpotBugsTask) {
    excludeFilter = file('spotbugs-exclude.xml')
}

tasks.named('spotbugsTest', com.github.spotbugs.snom.SpotBugsTask) {
    enabled = false
}

def grammarDir = file('src/main/antlr/org/flowdigger/parsers')
def antlrOutputDir = file("$buildDir/generated-src/antlr/main")
tasks.register('generateLexerSources', JavaExec) {
    group = 'build'
    description = 'Generate ANTLR lexer sources for Java grammar.'
    classpath = configurations.antlr
    mainClass = 'org.antlr.v4.Tool'
    inputs.file(new File(grammarDir, 'JavaLexer.g4'))
    outputs.dir(antlrOutputDir)
    doFirst {
        antlrOutputDir.mkdirs()
    }
    args '-listener', '-no-visitor', '-Xexact-output-dir', '-o', antlrOutputDir.absolutePath,
            new File(grammarDir, 'JavaLexer.g4').absolutePath
}

tasks.register('generateParserSources', JavaExec) {
    group = 'build'
    description = 'Generate ANTLR parser/listener sources for Java grammar.'
    dependsOn tasks.named('generateLexerSources')
    classpath = configurations.antlr
    mainClass = 'org.antlr.v4.Tool'
    inputs.file(new File(grammarDir, 'JavaParser.g4'))
    outputs.dir(antlrOutputDir)
    doFirst {
        antlrOutputDir.mkdirs()
    }
    workingDir = antlrOutputDir
    args '-listener', '-no-visitor', '-Xexact-output-dir',
            '-lib', antlrOutputDir.absolutePath, '-o', antlrOutputDir.absolutePath,
            new File(grammarDir, 'JavaParser.g4').absolutePath
}

sourceSets {
    main {
        java {
            srcDir antlrOutputDir
        }
        resources {
            srcDir 'src/main/antlr'
            include '**/*.g4'
        }
    }
}

tasks.named('javadoc', Javadoc) {
    // Generated ANTLR sources are implementation artifacts, not public plugin API docs.
    exclude { details ->
        details.file.toPath().startsWith(antlrOutputDir.toPath())
    }
}

tasks.named('compileJava') {
    dependsOn tasks.named('generateParserSources')
}

tasks.named('generateGrammarSource') {
    enabled = false
}

tasks.named('sourcesJar', org.gradle.api.tasks.bundling.Jar) {
    dependsOn tasks.named('generateParserSources')
    duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE
}

tasks.register('verifyGrammarSources') {
    group = 'verification'
    description = 'Checks that Java grammar source files are present.'
    def requiredFiles = [
            file('src/main/antlr/org/flowdigger/parsers/JavaLexer.g4'),
            file('src/main/antlr/org/flowdigger/parsers/JavaParser.g4')
    ]
    inputs.files(requiredFiles)
    doLast {
        requiredFiles.each { f ->
            if (!f.isFile()) {
                throw new GradleException("Missing required grammar file: ${f.path}")
            }
        }
    }
}

tasks.register('verifyJarLayout') {
    group = 'verification'
    description = 'Verifies grammar jar contains Java parser classes and .g4 files.'
    dependsOn tasks.named('jar')
    def jarArchive = tasks.named('jar', org.gradle.api.tasks.bundling.Jar).flatMap { it.archiveFile }
    inputs.file(jarArchive)

    doLast {
        def jarFile = jarArchive.get().asFile
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            def entries = zip.entries().collect { it.name }
            def requiredEntries = [
                    'org/flowdigger/parsers/JavaLexer.g4',
                    'org/flowdigger/parsers/JavaParser.g4'
            ]
            requiredEntries.each { path ->
                if (!entries.contains(path)) {
                    throw new GradleException("Missing required jar entry: ${path} in ${jarFile.name}")
                }
            }
            if (!entries.any { it ==~ /org\/flowdigger\/parsers\/JavaLexer(\$.*)?\.class/ }) {
                throw new GradleException("Missing required lexer class entry under org/flowdigger/parsers in ${jarFile.name}")
            }
            if (!entries.any { it ==~ /org\/flowdigger\/parsers\/JavaParser(\$.*)?\.class/ }) {
                throw new GradleException("Missing required parser class entry under org/flowdigger/parsers in ${jarFile.name}")
            }
        } finally {
            zip.close()
        }
    }
}

def configureDirectoryProperty = { Object property, Object value ->
    if (value instanceof org.gradle.api.provider.Provider || value instanceof org.gradle.api.file.Directory) {
        property.set(value)
    } else {
        property.set(layout.dir(providers.provider { file(value) }))
    }
}

def configureXmlAstTask = { XmlAstGradleTask taskRef, Object sourceDir, Object destDir, String description ->
    taskRef.group = 'verification'
    taskRef.description = description
    taskRef.dependsOn tasks.named('classes')
    taskRef.grammar.set('java')
    taskRef.parserClassName.set('org.flowdigger.parsers.JavaParser')
    taskRef.lexerClassName.set('org.flowdigger.parsers.JavaLexer')
    taskRef.startRule.set('compilationunit')
    configureDirectoryProperty(taskRef.sourceDirectory, sourceDir)
    configureDirectoryProperty(taskRef.destinationDirectory, destDir)
    taskRef.includes.set(['**/*.java'])
    taskRef.targetExtension.set('.xml')
    taskRef.continueOnError.set(false)
    taskRef.runtimeClasspath.from(configurations.runtimeClasspath)
}

def excludeJavaFilesWithErrorsCompanion = { XmlAstGradleTask taskRef, org.gradle.api.file.Directory examplesDirectory ->
    def base = examplesDirectory.asFile.toPath()
    def excludedJavaFiles = fileTree(examplesDirectory.asFile) {
        include '**/*.java.errors'
    }.files.collect { errorFile ->
        base.relativize(errorFile.toPath()).toString().replace('\\', '/').replaceAll(/\.errors$/, '')
    }
    taskRef.excludes.addAll(excludedJavaFiles)
}

tasks.register('javaXmlAstExamples', XmlAstGradleTask) { it ->
    def examplesDirectory = layout.projectDirectory.dir('src/test/resources/examples')
    configureXmlAstTask(it, examplesDirectory, layout.buildDirectory.dir('xmlast-examples'), 'Parses Java grammar examples to XML AST.')
    excludeJavaFilesWithErrorsCompanion(it, examplesDirectory)
}

tasks.register('XmlAstGradleTask', XmlAstGradleTask) { it ->
    def examplesDirectory = layout.projectDirectory.dir('src/test/resources/examples')
    configureXmlAstTask(it, examplesDirectory, layout.buildDirectory.dir('xmlast-xmlastgradletask'), 'Compatibility task for direct XmlAstGradleTask invocation.')
    excludeJavaFilesWithErrorsCompanion(it, examplesDirectory)
}



tasks.withType(Test).configureEach {
    useJUnit()
    dependsOn tasks.named('compileJava')
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('test') {
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    classDirectories.setFrom(files(sourceSets.main.output.classesDirs.asFileTree.matching {
        include 'org/flowdigger/gradle/antlr/**'
    }))
    sourceDirectories.setFrom(files(sourceSets.main.allSource.srcDirs))
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('jacocoTestReport')
    classDirectories.setFrom(files(sourceSets.main.output.classesDirs.asFileTree.matching {
        include 'org/flowdigger/gradle/antlr/**'
    }))
    sourceDirectories.setFrom(files(sourceSets.main.allSource.srcDirs))
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.60
            }
        }
    }
}

tasks.register('coverage') {
    group = 'verification'
    description = 'Runs tests, generates JaCoCo report, and verifies minimum coverage threshold.'
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

tasks.register('stageCentralBundleRepo', Sync) {
    dependsOn tasks.named('publishMavenJavaPublicationToMavenLocal')
    def artifactBaseDir = file("${System.getProperty('user.home')}/.m2/repository/org/flowdigger/gradle/gradle-antlr-java-plugin")
    def artifactVersionDir = file("${artifactBaseDir}/${project.version}")
    from(artifactVersionDir)
    into(layout.buildDirectory.dir("central-staging-repo/org/flowdigger/gradle/gradle-antlr-java-plugin/${project.version}"))

    doFirst {
        if (!artifactVersionDir.exists()) {
            throw new GradleException("Expected local Maven artifact version directory not found: ${artifactVersionDir}")
        }
    }
}

tasks.register('generateCentralBundleChecksums') {
    dependsOn tasks.named('stageCentralBundleRepo')

    doLast {
        def stagedVersionDir = layout.buildDirectory
                .dir("central-staging-repo/org/flowdigger/gradle/gradle-antlr-java-plugin/${project.version}")
                .get()
                .asFile
        if (!stagedVersionDir.exists()) {
            throw new GradleException("Expected staged version directory not found: ${stagedVersionDir}")
        }

        def checksum = { File file, String algorithm ->
            MessageDigest digest = MessageDigest.getInstance(algorithm)
            file.withInputStream { input ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = input.read(buffer)) != -1) {
                    digest.update(buffer, 0, read)
                }
            }
            digest.digest().collect { String.format('%02x', it & 0xff) }.join('')
        }

        stagedVersionDir.eachFileRecurse { file ->
            if (file.isFile() && !file.name.endsWith('.md5') && !file.name.endsWith('.sha1')) {
                file.parentFile.mkdirs()
                new File(file.parentFile, "${file.name}.md5").text = "${checksum(file, 'MD5')}\n"
                new File(file.parentFile, "${file.name}.sha1").text = "${checksum(file, 'SHA-1')}\n"
            }
        }
    }
}

tasks.register('packageCentralBundle', Zip) {
    dependsOn tasks.named('generateCentralBundleChecksums')
    archiveBaseName.set('gradle-antlr-java-plugin')
    archiveVersion.set(project.version.toString())
    archiveClassifier.set('central-bundle')
    destinationDirectory.set(layout.buildDirectory.dir('central-bundle'))
    from(layout.buildDirectory.dir('central-staging-repo'))
}

tasks.named('check') {
    dependsOn tasks.named('verifyGrammarSources')
    dependsOn tasks.named('verifyJarLayout')
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

tasks.register('allSecurityChecks') {
    group = 'verification'
    description = 'Run dependency and static analysis checks.'
    dependsOn tasks.named('check')
    def dependencyCheckTask = tasks.findByName('dependencyCheck') ?: tasks.findByName('dependencyCheckAnalyze')
    if (dependencyCheckTask != null) {
        dependsOn dependencyCheckTask
    }
    dependsOn tasks.named('spotbugsMain')
}
