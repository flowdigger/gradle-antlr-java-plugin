name: CodeQL

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main", "release/**"]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Clone flowdigger-gradle for composite build
        run: |
          if [ ! -d ../flowdigger-gradle/.git ]; then
            git clone --depth 1 --branch main https://github.com/flowdigger/flowdigger-gradle.git ../flowdigger-gradle
          fi

      - name: Autobuild
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon classes testClasses

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
